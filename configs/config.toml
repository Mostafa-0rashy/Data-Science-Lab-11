[data]
raw_path = "data/raw/Teen_Mental_Health_Dataset.csv"
output_path = "reports/validation_raw.json"
raw_data_path = "data/raw/Teen_Mental_Health_Dataset.csv"
cleaned_data_path = "data/processed/clean.csv"
featured_data_path = "data/processed/features.csv"
target_column = "depression_label"
test_size = 0.2
random_state = 42
train_feature_columns = [
    "age",
    "daily_social_media_hours",
    "sleep_hours",
    "screen_time_before_sleep",
    "academic_performance",
    "physical_activity",
    "stress_level",
    "anxiety_level",
    "addiction_level",
]
numeric_columns = [
    "age",
    "daily_social_media_hours",
    "sleep_hours",
    "screen_time_before_sleep",
    "academic_performance",
    "physical_activity",
    "stress_level",
    "anxiety_level",
    "addiction_level",
]
categorical_columns = [
    "gender",
    "platform_usage",
    "social_interaction_level",
]

[reports]
cleaning_log_path = "reports/cleaning_log.json"
feature_log_path = "reports/feature_log.json"
validation_raw_path = "reports/validation_raw.json"
validation_cleaned_path = "reports/validation_cleaned.json"
metrics_path = "reports/metrics.json"
classification_metrics_path = "reports/classification_metrics.json"
pipeline_report_path = "reports/pipeline_report.md"

[model]
n_estimators = 200
max_depth = 8
model_output_path = "models/best_model.pkl"

[validation]
required_columns = [
    "age",
    "gender",
    "daily_social_media_hours",
    "platform_usage",
    "sleep_hours",
    "screen_time_before_sleep",
    "academic_performance",
    "physical_activity",
    "social_interaction_level",
    "stress_level",
    "anxiety_level",
    "addiction_level",
    "depression_label"
]